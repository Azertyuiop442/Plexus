<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Plexus architecture — a native shell decoupled from its mods</title>
  <desc id="arch-desc">Plexus TUI shell talks to custom mods through a JSON file-IPC bridge in /tmp/cc-sidebar; mods push state into the bridge, the shell renders it and dispatches user actions.</desc>
  <defs>
    <style><![CDATA[
      .eyebrow { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; fill: #bfc0c0; }
      .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 400; letter-spacing: -0.01em; fill: #f5f5f5; }
      .sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #bfc0c0; }
      .node-name { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f5f5f5; }
      .node-sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9.5px; fill: #bfc0c0; }
      .tag { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7px; font-weight: 600; letter-spacing: 0.12em; }
      .ghost { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 40px; font-weight: 600; }
      .arrow-lbl { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7.5px; font-weight: 500; letter-spacing: 0.12em; }
      .legend-lbl { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 9px; fill: #bfc0c0; }
      .legend-mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; fill: #bfc0c0; }
    ]]></style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.05)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#2d3142"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>

  <!-- Header (centered) -->
  <text x="500" y="54" class="eyebrow" text-anchor="middle">Architecture · Plexus</text>
  <text x="500" y="92" class="title" text-anchor="middle">One shell, decoupled from its mods.</text>
  <text x="500" y="116" class="sub" text-anchor="middle">Standalone Rust TUI  ·  file-IPC bridge  ·  any-runtime mods</text>

  <!-- Zone: the file-IPC bridge protocol -->
  <rect x="320" y="128" width="360" height="212" rx="10" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
  <rect x="430" y="120" width="140" height="16" rx="2" fill="#2d3142"/>
  <text x="500" y="132" class="tag" fill="rgba(191,192,192,0.55)" text-anchor="middle">FILE IPC · /TMP/CC-SIDEBAR</text>

  <!-- Solid arrows (forward path, row level) -->
  <line x1="288" y1="222" x2="388" y2="222" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="712" y1="222" x2="620" y2="222" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Dashed returns (inside and below the zone) -->
  <path d="M 504,268 V 318 H 176 V 268" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 616,268 V 356 H 832 V 268" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="308" y="176" width="70" height="15" rx="2" fill="#2d3142"/>
  <text x="343" y="187" class="arrow-lbl" fill="#6a95d8" text-anchor="middle">CLICKS · KEYS</text>
  <rect x="636" y="176" width="70" height="15" rx="2" fill="#2d3142"/>
  <text x="671" y="187" class="arrow-lbl" fill="#f08a59" text-anchor="middle">PUSH JSON</text>
  <rect x="240" y="304" width="76" height="14" rx="2" fill="#2d3142"/>
  <text x="278" y="314" class="arrow-lbl" fill="#bfc0c0" text-anchor="middle">ACTIONS · UI</text>
  <rect x="680" y="342" width="66" height="14" rx="2" fill="#2d3142"/>
  <text x="713" y="352" class="arrow-lbl" fill="#bfc0c0" text-anchor="middle">DISPATCH</text>

  <!-- Node: Plexus Shell -->
  <rect x="64" y="176" width="224" height="92" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
  <rect x="72" y="184" width="40" height="14" rx="2" fill="transparent" stroke="rgba(191,192,192,0.35)" stroke-width="0.8"/>
  <text x="92" y="193" class="tag" fill="#8e98ac" text-anchor="middle">TERM</text>
  <text x="272" y="256" class="ghost" fill="rgba(245,245,245,0.06)" text-anchor="end">01</text>
  <text x="176" y="234" class="node-name" text-anchor="middle">Plexus Shell</text>
  <text x="176" y="250" class="node-sub" text-anchor="middle">ratatui · pty · panes</text>

  <!-- Node: Mod Bridge (focal) -->
  <rect x="392" y="176" width="224" height="92" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/>
  <rect x="400" y="184" width="36" height="14" rx="2" fill="transparent" stroke="rgba(240,138,89,0.5)" stroke-width="0.8"/>
  <text x="418" y="193" class="tag" fill="#f08a59" text-anchor="middle">IPC</text>
  <text x="600" y="256" class="ghost" fill="rgba(240,138,89,0.18)" text-anchor="end">02</text>
  <text x="504" y="234" class="node-name" text-anchor="middle">Mod Bridge</text>
  <text x="504" y="250" class="node-sub" text-anchor="middle">mods-data · mod-pickup</text>

  <!-- Node: Custom Mods -->
  <rect x="712" y="176" width="224" height="92" rx="6" fill="rgba(245,245,245,0.06)" stroke="rgba(191,192,192,0.55)" stroke-width="1"/>
  <rect x="720" y="184" width="40" height="14" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
  <text x="740" y="193" class="tag" fill="#8e98ac" text-anchor="middle">MOD</text>
  <text x="920" y="256" class="ghost" fill="rgba(245,245,245,0.06)" text-anchor="end">03</text>
  <text x="824" y="234" class="node-name" text-anchor="middle">Your Mods</text>
  <text x="824" y="250" class="node-sub" text-anchor="middle">python · node · go · rust</text>

  <!-- Legend (centered) -->
  <g transform="translate(119, 0)">
    <line x1="56" y1="430" x2="944" y2="430" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
    <text x="56" y="448" class="legend-mono">LEGEND</text>

    <rect x="56" y="464" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
    <text x="76" y="472" class="legend-lbl">Shell</text>

    <rect x="150" y="464" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/>
    <text x="170" y="472" class="legend-lbl">Focal / bridge</text>

    <rect x="284" y="464" width="14" height="10" rx="2" fill="rgba(245,245,245,0.06)" stroke="rgba(191,192,192,0.55)" stroke-width="1"/>
    <text x="304" y="472" class="legend-lbl">Mods</text>

    <line x1="386" y1="469" x2="414" y2="469" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="422" y="472" class="legend-lbl">Keys &amp; clicks</text>

    <line x1="536" y1="469" x2="564" y2="469" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="572" y="472" class="legend-lbl">Push JSON</text>

    <line x1="672" y1="469" x2="700" y2="469" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="708" y="472" class="legend-lbl">Actions / dispatch</text>
  </g>
</svg>